name: safe_connect
description: Safe Connect - Hybrid Emergency and Communication Alert System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_ble_peripheral: ^2.1.0
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  cupertino_icons: ^1.0.6
  go_router: ^13.2.0
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.3.0
  flutter_blue_plus: ^1.36.8
  geolocator: ^11.1.0
  geocoding: ^3.0.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.1.0
  cloud_firestore: ^5.4.0
  firebase_auth: ^5.3.0
  permission_handler: ^11.4.0
  connectivity_plus: ^6.1.0
  uuid: ^4.4.0
  intl: ^0.19.0
  flutter_local_notifications: ^18.0.1
  flutter_background_service: ^5.0.5
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1
  flutter_contacts: ^1.1.9+2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/firstaid/firstaid_data.json
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#1565C0"
  image: assets/images/splash_logo.png
  android: true
  ios: false
  fullscreen: false